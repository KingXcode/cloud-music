# 此文件配置 Dart 静态分析器，
# 用于检查代码错误、警告和代码规范问题。
#
# 分析器发现的问题会显示在支持 Dart 的 IDE 界面中
# （https://dart.dev/tools#ides-and-editors）。也可以在命令行执行
# `flutter analyze` 来运行分析器。

# 以下配置为 Flutter 应用、包和插件启用一组推荐规范，
# 以促进良好的编码实践。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - web/**

linter:
  # 可在下方自定义本项目的代码规范规则，
  # 禁用上方引入的 `package:flutter_lints/flutter.yaml` 中的规则，
  # 或启用其他规则。全部可用规则及其文档
  # 见 https://dart.dev/lints。
  #
  # 除了在下方为整个项目禁用规则，
  # 也可在触发规范提示的代码行或 Dart 文件中，
  # 使用 `// ignore: name_of_lint` 或
  # `// ignore_for_file: name_of_lint`，
  # 仅对单行或指定文件屏蔽该规则。
  rules:
    # avoid_print: false  # 取消注释以禁用 `avoid_print` 规则
    # prefer_single_quotes: true  # 取消注释以启用 `prefer_single_quotes` 规则

# 此文件的更多说明见
# https://dart.dev/guides/language/analysis-options
