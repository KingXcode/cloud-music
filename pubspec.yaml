name: cloud_music
description: 私有音乐播放器，支持 Apple 设备、Android 文件夹及浏览器，直接播放原始音频文件。
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  folder_audio:
    path: packages/folder_audio
  web: ^1.1.1
  cupertino_icons: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
