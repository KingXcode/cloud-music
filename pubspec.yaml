name: cloud_music
description: 私有音乐播放器，支持 Apple 设备、Android 文件夹及浏览器，直接播放原始音频文件。
publish_to: none
version: 0.7.0+12
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  folder_audio:
    path: packages/folder_audio
  web: ^1.1.1
  http: ^1.6.0
  crypto: ^3.0.7
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  cupertino_icons: ^1.0.9
dependency_overrides:
  # 网页采用独立 GIS 桥接，避免原生依赖自动预加载第二套网页授权 SDK。
  google_sign_in_web:
    path: packages/google_sign_in_web_no_autoload
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: false
