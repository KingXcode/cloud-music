name: folder_audio
description: "在 Apple 和 Android 平台只读访问文件夹并播放原始音频文件。"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 此文件中通用 Dart 配置部分的说明，见
# https://dart.dev/tools/pub/pubspec

# 以下部分为 Flutter 包专用配置。
flutter:
  # 此部分将当前 Flutter 项目标记为插件项目。
  # 'pluginClass' 指定应注册到插件注册表中的类，
  # 可使用 Java、Kotlin、Swift、Objective-C 等语言实现。
  # 使用方法通道时必须指定该类。
  # Android 的 'package' 指定所注册类所在的包。
  # 在 Android 上使用方法通道时必须提供该配置。
  # 'ffiPlugin' 表示需要构建并打包原生代码，
  # 使用 `dart:ffi` 时必须设置。
  # 工具会使用这些配置，在为项目添加或更新资源时
  # 保持一致性。
  plugin:
    platforms:
      android:
        package: dev.cloudmusic.folder_audio
        pluginClass: FolderAudioPlugin
      ios:
        pluginClass: FolderAudioPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FolderAudioPlugin
        sharedDarwinSource: true

  # 如需为插件包添加资源，可增加 assets 配置，例如：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # 包内资源的详细说明见
  # https://flutter.dev/to/asset-from-package
  #
  # 图片资源可对应一个或多个不同分辨率的变体，详见
  # https://flutter.dev/to/resolution-aware-images

  # 如需为插件包添加自定义字体，请在当前 "flutter" 部分
  # 增加 fonts 配置。列表中的每项都应包含
  # "family" 键，指定字体族名称，以及 "fonts" 键，
  # 列出字体资源和其他描述信息。
  # 例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 包内字体的详细说明见
  # https://flutter.dev/to/font-from-package
