name: Publish verified Android preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful package workflow run with android-package artifact
        required: true
        type: string
      tag:
        description: New Android-only preview tag
        required: true
        default: v0.6.0-android-preview.1
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate originating build and download its verified Android package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_repository.full_name == $repo and .path == ".github/workflows/build-release.yml"' run.json
          echo "BUILD_COMMIT=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
          gh run download "$BUILD_RUN" --name android-package --dir dist
          test -s dist/cloud-music-android-test-signed.apk
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/android-signature.txt
          grep -q "package: name='dev.cloudmusic.cloud_music'" dist/android-package.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish APK-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android-preview\.[0-9]+$ ]] || exit 1
          python3 scripts/create_update_manifest.py dist "$RELEASE_TAG" --android-only
          (cd dist && sha256sum *.apk update-manifest.json > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/* --target "$BUILD_COMMIT" --title "Cloud Music $RELEASE_TAG (Android preview)" --notes-file docs/ANDROID_RELEASE_NOTES.md --prerelease
