name: Deploy Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci_flutter.sh
      - run: flutter pub get
      - name: Verify update manifest generator
        run: python3 -m unittest discover -s test/scripts -v
      - run: flutter analyze && flutter test
      - name: Lyrics browser regression
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: flutter test --platform chrome test/lyrics_web_test.dart test/library_filter_web_test.dart
      - run: node --test test/web/*.cjs
      - name: Build for the repository Pages path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          GOOGLE_DRIVE_WEB_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_WEB_CLIENT_ID }}
        run: flutter build web --release --no-web-resources-cdn --base-href "/$REPOSITORY_NAME/" --dart-define="GOOGLE_DRIVE_WEB_CLIENT_ID=$GOOGLE_DRIVE_WEB_CLIENT_ID"
      - name: Prepare verified web update resources
        run: node scripts/prepare_web_updates.cjs build/web
      - name: Verify Google Drive loads GIS only after user action
        run: node scripts/verify_drive_web_build.cjs build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
