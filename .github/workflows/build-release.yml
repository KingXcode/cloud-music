name: Build APK and macOS DMG
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build (Android-only does not publish a release)
        required: true
        default: all
        type: choice
        options: [all, android]
      tag:
        description: Preview release tag
        required: true
        default: v0.6.0-preview.1
        type: string
permissions:
  contents: read
env:
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci_flutter.sh
      - run: flutter pub get
      - name: Verify update manifest generator
        run: python3 -m unittest discover -s test/scripts -v
      - run: flutter analyze
      - run: flutter test
      - name: Lyrics browser regression
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: flutter test --platform chrome test/lyrics_web_test.dart test/library_filter_web_test.dart
      - name: Browser gateway tests
        run: node --test test/web/*.cjs
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/ci_flutter.sh
      - run: flutter pub get
      - name: Build universal preview APK with standard debug/test signing
        env:
          GOOGLE_DRIVE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_SERVER_CLIENT_ID }}
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define="GOOGLE_DRIVE_SERVER_CLIENT_ID=$GOOGLE_DRIVE_SERVER_CLIENT_ID"
      - name: Run Android bridge JVM tests
        run: cd android && ./gradlew :folder_audio:testDebugUnitTest :app:testDebugUnitTest
      - name: Verify APK signature, package and native code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/android-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/android-package.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/libapp.so'
          cp "$APK" dist/cloud-music-android-test-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/*
  macos:
    if: inputs.platform != 'android'
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci_flutter.sh
      - run: flutter pub get
      - name: Compile iPhone and iPad target without signing
        run: flutter build ios --release --no-codesign
      - name: Prepare macOS test configuration
        run: flutter build macos --debug --config-only
      - name: Test macOS update path confinement and quarantine
        run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
      - name: Build macOS release without Developer ID or notarization
        run: flutter build macos --release
      - run: bash scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*
  release:
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: dist
          merge-multiple: true
      - name: Create checksums and publish a clearly labeled preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          python3 scripts/create_update_manifest.py dist "$RELEASE_TAG"
          (cd dist && sha256sum *.apk *.dmg update-manifest.json > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Cloud Music $RELEASE_TAG (preview)" --notes-file docs/RELEASE_NOTES.md --prerelease
